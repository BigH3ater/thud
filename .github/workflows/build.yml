# kdk build: debug APK on every push/PR, public pre-release on a kdk-v* tag.
# Plan: kodiak-codex "linux-tools dev pipeline v2" (Design items 1-3).
# Every action is pinned by full commit SHA.
name: kdk-build

on:
  push:
    branches: [feat/kdk-integration]
    tags: ['kdk-v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: kdk-build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      ver: ${{ steps.ver.outputs.ver }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # versionCode = commit count, versionName = git describe

      - name: No secrets committed
        run: |
          set -euo pipefail
          bad=$(git ls-files | grep -E '\.(pem|crt|key|p12|jks|keystore)$' || true)
          tracked=$(git ls-files | grep -E '(^|/)(kdk-ha\.conf|local\.properties)$' || true)
          if [ -n "$bad$tracked" ]; then
            echo "::error::secret-like files are tracked:"
            printf '%s\n' "$bad" "$tracked" | sed '/^$/d'
            exit 1
          fi
          echo "no secret-like files tracked"

      - name: Version
        id: ver
        run: |
          set -euo pipefail
          code=$(git rev-list --count HEAD)
          # base tag kdk-v1.0.0; strip the kdk- prefix so the tag kdk-v1.0.0 gives v1.0.0
          name=$(git describe --tags --always --dirty --match 'kdk-v*')
          name=${name#kdk-}
          echo "versionCode=$code versionName=$name"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "ver=$name" >> "$GITHUB_OUTPUT"

      - name: Release builds must use the kdk key
        if: startsWith(github.ref, 'refs/tags/kdk-v')
        env:
          KDK_KEYSTORE_B64: ${{ secrets.KDK_KEYSTORE_B64 }}
          KDK_KEYSTORE_PASS: ${{ secrets.KDK_KEYSTORE_PASS }}
        run: |
          if [ -z "$KDK_KEYSTORE_B64" ] || [ -z "$KDK_KEYSTORE_PASS" ]; then
            echo "::error::KDK_KEYSTORE_B64 / KDK_KEYSTORE_PASS secrets missing; refusing to release a default-debug-key APK"
            exit 1
          fi

      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '15859902'
          log-accepted-android-sdk-licenses: false
          packages: 'platforms;android-35 build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: assembleDebug
        env:
          # Empty on fork PRs: Gradle then keeps the default debug key.
          KDK_KEYSTORE_B64: ${{ secrets.KDK_KEYSTORE_B64 }}
          KDK_KEYSTORE_PASS: ${{ secrets.KDK_KEYSTORE_PASS }}
          VER_CODE: ${{ steps.ver.outputs.code }}
          VER_NAME: ${{ steps.ver.outputs.ver }}
        run: ./gradlew assembleDebug -PkdkVersionCode="$VER_CODE" -PkdkVersionName="$VER_NAME"

      - name: Rename, checksum, log signer
        env:
          VER: ${{ steps.ver.outputs.ver }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/thud-kdk-$VER.apk"
          rm -rf app/build/kdk   # decoded keystore, never kept past the build
          cd dist
          sha256sum "thud-kdk-$VER.apk" > "thud-kdk-$VER.apk.sha256"
          cat "thud-kdk-$VER.apk.sha256"
          # Signer fingerprint only (must match the note on 1Password item thud-kdk-signing).
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "thud-kdk-$VER.apk" \
            | grep -E 'certificate SHA-256 digest'

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: thud-kdk-${{ steps.ver.outputs.ver }}
          path: dist/
          retention-days: 14
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/kdk-v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: thud-kdk-${{ needs.build.outputs.ver }}
          path: dist

      - name: Verify checksum
        working-directory: dist
        env:
          VER: ${{ needs.build.outputs.ver }}
        run: sha256sum -c "thud-kdk-$VER.apk.sha256"

      - name: Create pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ needs.build.outputs.ver }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease \
            --title "thud-kdk $VER" \
            --notes "Debug build (debuggable, kdk signing key) of $TAG. Verify with sha256sum -c." \
            "dist/thud-kdk-$VER.apk" "dist/thud-kdk-$VER.apk.sha256"
